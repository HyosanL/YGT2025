# main 푸시마다 Cloudflare Pages로 자동 배포
# 사전 조건: GitHub 저장소 Settings → Secrets → Actions에 CLOUDFLARE_API_TOKEN 등록
# (Cloudflare 대시보드 → My Profile → API Tokens → "Cloudflare Pages — Edit" 템플릿)
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 2f39f5d5086bcc302bca512cfe854942
          command: pages deploy dist --project-name=ygt2025 --branch=main
