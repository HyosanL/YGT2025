<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ff8c42" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="YGT 2025" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- 손그림 화풍에 맞춘 만화체 한글 폰트 (Jua = 제목·버튼, Poor Story = 본문).
         구글이 한글을 유니코드 구간별로 잘게 쪼개 주므로 실제로 쓰는 글자만 내려받는다.
         첫 방문 온라인 시 서비스워커가 캐시해 두어 이후에는 오프라인에서도 뜬다. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jua&family=Poor+Story&display=swap"
      rel="stylesheet"
    />
    <title>YGT 2025</title>
    <script>
      // 카카오톡 인앱 브라우저는 오디오/키보드/저장이 불안정 — 기본 브라우저로 보낸다.
      // 인앱과 기본 브라우저는 localStorage가 분리되어 있어 닉네임을 ?nick=으로 인계한다.
      (function () {
        var ua = navigator.userAgent.toLowerCase();
        if (ua.indexOf('kakaotalk') === -1) return;
        window.__KAKAO_INAPP__ = true;
        var nick = '';
        try {
          var save = JSON.parse(localStorage.getItem('ygt2025_save_v1') || 'null');
          if (save && save.settings && typeof save.settings.nickname === 'string') {
            nick = save.settings.nickname;
          }
        } catch (e) { /* 무시 */ }
        var target =
          location.origin + location.pathname + (nick ? '?nick=' + encodeURIComponent(nick) : '');
        location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(target);
        document.addEventListener('DOMContentLoaded', function () {
          var guide = document.getElementById('inapp-guide');
          if (guide) guide.style.display = 'flex';
        });
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        /* fixed + inset:0 — 모바일 브라우저 툴바 증감에도 보이는 영역만 차지 */
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        background: #1a1a2e;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* 노치/상태바/홈바(안전영역)를 피해서 캔버스를 배치 — 위아래 잘림 방지 */
      #app {
        position: absolute;
        top: env(safe-area-inset-top, 0px);
        right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px);
        left: env(safe-area-inset-left, 0px);
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <!-- 카톡 인앱 브라우저 안내 (자동 이동 실패 대비) -->
    <div
      id="inapp-guide"
      style="
        display: none;
        position: fixed;
        inset: 0;
        z-index: 200;
        background: #1a1a2e;
        color: #f5f5f5;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 32px;
        text-align: center;
        font-family: 'Malgun Gothic', sans-serif;
        font-size: 17px;
        line-height: 1.6;
      "
    >
      <div style="font-size: 44px">✈️</div>
      <div>
        원활한 플레이를 위해<br /><b>기본 브라우저</b>로 이동하고 있어요.<br /><br />
        자동으로 열리지 않으면 우측 하단 <b>⋯ 메뉴</b>에서<br />
        <b>'다른 브라우저로 열기'</b>를 눌러주세요.
      </div>
      <button
        onclick="location.href='kakaotalk://inappbrowser/close'"
        style="
          margin-top: 8px;
          padding: 14px 34px;
          font-size: 17px;
          border: none;
          border-radius: 12px;
          background: #e94560;
          color: #fff;
        "
      >
        이 창 닫기
      </button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
